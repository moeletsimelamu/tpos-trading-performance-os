name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway container credential for the integration tests; not used anywhere else
          MSSQL_SA_PASSWORD: Ci-Only-Sql-Password-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Only-Sql-Password-1 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      MELAMU_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci-Only-Sql-Password-1;TrustServerCertificate=True;"
      DOTNET_NOLOGO: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MelamuHoldings.slnx

      - name: Build (warnings are errors)
        run: dotnet build MelamuHoldings.slnx --no-restore --configuration Release -warnaserror

      - name: Fail on vulnerable NuGet packages
        run: |
          dotnet list MelamuHoldings.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Unit and integration tests
        run: dotnet test MelamuHoldings.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MelamuHoldings.Angular

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MelamuHoldings.Angular/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npx ng build

      - name: Unit tests
        run: npx ng test --watch=false
